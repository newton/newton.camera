# Builds the site and publishes it to GitHub Pages.
#
# Runs when:
#   - you push a change (new photos, edited text, design changes)
#   - you press "Run workflow" on the Actions tab  ← use this after editing an album in Lightroom
#   - every night at 3:17 Pacific (picks up Lightroom album changes automatically)
#
# Photos from Lightroom albums are never committed to the repo. Each run starts from the
# previous run's copy (kept in the Actions cache), syncs changes from Lightroom, and saves
# the result for next time. If Lightroom can't be reached, the previous copy is published.
name: Publish site

on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: "17 10 * * *"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: publish
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # Last run's Lightroom photos and resized images.
      - name: Restore photos from the last run
        uses: actions/cache/restore@v6
        with:
          path: |
            content/lightroom
            _site/img
          key: site-${{ github.run_id }}
          restore-keys: site-

      - name: Check for Lightroom albums
        id: lr
        run: |
          if grep -qE '^\s*-\s*slug:' content/lightroom.yml; then echo "has=true" >> "$GITHUB_OUTPUT"; fi

      - name: Install browser for the sync
        if: steps.lr.outputs.has == 'true'
        run: npx playwright install --with-deps chromium

      - name: Sync from Lightroom
        continue-on-error: true   # a Lightroom hiccup should never take the site down
        run: npm run sync

      - id: pages
        uses: actions/configure-pages@v6

      - run: npm run build
        env:
          PATH_PREFIX: ${{ steps.pages.outputs.base_path }}/

      - name: Save photos for the next run
        if: ${{ !cancelled() }}
        uses: actions/cache/save@v6
        with:
          path: |
            content/lightroom
            _site/img
          key: site-${{ github.run_id }}

      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site

      - id: deploy
        uses: actions/deploy-pages@v5
