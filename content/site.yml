intro: >-
  I photograph artwork and objects with high accuracy for catalogs and
  reproduction. Paintings, works on paper, glass, sculpture and ephemera,
  in the studio or on site.

about: |
  I live in Seattle and make photographs of other people's work: paintings
  for catalogs, prints for giclée editions, objects for archives and books.

  The job is to make the photograph disappear. Every session is shot to a
  color target and profiled, so what you see on the page matches what hangs
  on the wall. Cross-polarized lighting for glossy and textured surfaces,
  stitched captures for large works, and files delivered ready for press.

services:
  - Catalog and archive photography
  - Fine-art reproduction and giclée-ready files
  - Large works captured in stitched tiles
  - Objects, glass and sculpture
  - On-site capture at studios, galleries and collections

